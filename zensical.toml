# ==============================================================================
# 1. Core Project Metadata
# ==============================================================================
[project]
site_name = "Agentic Market Panic Simulator (AMPS)"
site_description = "A high-throughput, generative agent-based simulator modeling irrational panic, liquidity spirals, and behavioral contagion."
site_url = "https://foersben.github.io/agentic-market-panic-sim"
docs_dir = "docs"
site_dir = "site"
language = "en"

extra_css = ["https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"]
extra_javascript = [
    "https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js",
    "https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js",
    "https://unpkg.com/mermaid@10/dist/mermaid.min.js",
    "javascripts/katex.js",
]

# Document Tree Navigation Topology
nav = [
    { Home = "index.md" },
    { "Simulation Scenarios" = [
        { "The Flash Crash Benchmark" = "scenarios/flash_crash_benchmark.md" },
    ] },
    { "System Architecture" = [
        { "Infrastructure Layer" = [
            { "Server Setup" = "architecture/infrastructure/server_setup.md" },
        ] },
        { "Cognitive Engine Layer" = [
            { "Semantic Caching" = "architecture/cognitive_engine/semantic_caching.md" },
            { "RL Distillation" = "architecture/cognitive_engine/reinforcement_learning.md" },
        ] },
        { "Simulation Engine Layer" = [
            { "Semantic Intent Translation" = "architecture/simulation_engine/semantic_intent_translation.md" },
        ] },
    ] },
    { "MLOps & Operations" = [
        { "Execution Plans" = [
            { "MLOps Execution Plan" = "mlops/phase_1_execution.md" },
        ] },
    ] },
]

# ==============================================================================
# 2. UI Theme & Top Menu Layout
# ==============================================================================
[project.theme]
variant = "modern"

# Navigation features (Placed inside theme for top-menu tabs to function correctly)
features = [
    "navigation.tabs",
    "navigation.sections",
    "navigation.top",
    "toc.integrate",
    "search.suggest",
    "search.highlight",
    "content.code.copy",
]
[project.theme.palette]
scheme = "slate"
primary = "black"
accent = "deep-orange"

[project.theme.icon]
repo = "fontawesome/brands/github"

# ==============================================================================
# 3. Markdown Extensions
# ==============================================================================
[project.markdown_extensions]
admonition = {}
tables = {}
"pymdownx.details" = {}
"pymdownx.inlinehilite" = {}
"pymdownx.snippets" = {}
toc = { permalink = true }
"pymdownx.highlight" = { anchor_linenums = true }
"pymdownx.tasklist" = { custom_checkbox = true } # Enables Task Lists (- [ ])
"pymdownx.arithmatex" = { generic = true } # Enables LaTeX Support
"pymdownx.superfences" = { custom_fences = [ # Enables MermaidJS via superfences
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
] }

# ==============================================================================
# 5. Document Tree Navigation Topology
# ==============================================================================

# ==============================================================================
# 6. Plugins (MkDocstrings & HTML Proofer)
# ==============================================================================
[project.plugins.htmlproofer]

[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = ["."]

[project.plugins.mkdocstrings.handlers.python.options]
show_root_heading = true
show_source = true
heading_level = 2
show_signature_annotations = true

# ==============================================================================
# 7. Custom Infrastructure Mapping & Tracking (Zensical / OKF Layout)
# ==============================================================================
[tracking]
config = ["pyproject.toml", "zensical.toml", ".pre-commit-config.yaml"]
ci_cd = [".github/workflows/ci.yml"]

[documentation]
core = [
    "docs/index.md",
    "docs/scenarios/flash_crash_benchmark.md",
    "docs/architecture/infrastructure/server_setup.md",
    "docs/architecture/cognitive_engine/semantic_caching.md",
    "docs/architecture/cognitive_engine/reinforcement_learning.md",
    "docs/architecture/simulation_engine/semantic_intent_translation.md",
    "docs/mlops/phase_1_execution.md",
]
